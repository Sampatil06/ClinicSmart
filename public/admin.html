<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ClinicOps Template</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">Portfolio template</p><h1>ClinicOps</h1></div><button id="logout" hidden>Sign out</button></header>
<section id="login" class="card login"><h2>Clinic dashboard</h2><p>Generic demonstration application. Use your local admin password.</p><form id="loginForm"><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button><p id="error"></p></form></section>
<section id="app" hidden><nav><button class="nav active" data-pane="bookings">Bookings</button><button class="nav" data-pane="patients">Patients</button><button class="nav" data-pane="medicines">Medicines</button><button class="nav" data-pane="prescriptions">Prescriptions</button></nav><p id="message"></p>
<div class="pane active" data-pane="bookings"><section class="card"><h2>Appointment requests</h2><p>Requests submitted through the public clinic website.</p><ul id="bookingList"></ul></section></div>
<div class="pane" data-pane="patients"><div class="grid"><section class="card"><h2>Add patient</h2><form id="patientForm"><label>Name<input name="full_name" required maxlength="80"></label><label>Phone<input name="phone" required maxlength="20"></label><label>Notes<textarea name="notes" maxlength="2000"></textarea></label><button>Save patient</button></form></section><section class="card"><h2>Patients</h2><ul id="patientList"></ul></section></div></div>
<div class="pane" data-pane="medicines"><div class="grid"><section class="card"><h2>Add medicine</h2><form id="medicineForm"><label>Medicine name<input name="name" required maxlength="120"></label><button>Add medicine</button></form></section><section class="card"><h2>Medicine list</h2><ul id="medicineList"></ul></section></div></div>
<div class="pane" data-pane="prescriptions"><section class="card"><h2>Create prescription</h2><form id="prescriptionForm"><label>Patient<select id="prescriptionPatient" name="patient_id" required></select></label><label>Medicine<select id="prescriptionMedicine"></select></label><label>Units<input id="prescriptionQuantity" type="number" min="1" value="1"></label><label>How to take it<input id="prescriptionInstructions" maxlength="300"></label><button type="button" id="addItem" class="secondary">Add medicine</button><ul id="prescriptionItems"></ul><label>Doctor notes<textarea name="notes"></textarea></label><button>Create prescription</button></form></section></div>
</section></main><script src="app.js"></script></body></html>
